<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xthml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Form Keluhan Pelanggan (XHTML)</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        function fn_Valfrom(){
            var sMsg = "";

            if (document.getElementById("nama").value == ""){
                sMsg += "\n* Anda Belum Mengisikan Nama";
            }
            if (document.getElementById("pesanan").value == ""){
                sMsg += "\n* Anda Belum Mengisi Nomor Pesanan";
            }
            if (document.getElementById("keluhan").value == ""){
                sMsg += "\n* Anda Belum Mengisikan Keluhan";
            }

            if (sMsg != ""){
                alert("Peringatan:\n" + sMsg);
                return false;
            } else {
                return true;
            }
        }
    </script>
</head>

<body>
    <h1>From Keluhan Pelanggan</h1>
    <form action="#" method="post" onsubmit="return fn_Valfrom():">
        <p>Nama Pelanggan:<br /><input type="text" id="nama" name="nama" /></p>
        <p>Nomor Pesanan:<br /><input type="text" id="pesanan" name="pesanan" /></p>
        <p>Keluhan:<br /><textarea id="keluhan" name="keluhan" rows="4" cols="30"></textarea></p>
        <p><input type="submit" value="Send"/></p>
    </form>
</body>
</html>
